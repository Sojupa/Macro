name: Morning Macro & Advanced Risk Report

on:
  schedule:
    # 한국 시간 기준 월~금 08:30 실행 (UTC 기준 전날 23:30)
    - cron: '30 23 * * 0-4'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance finance-datareader fredapi beautifulsoup4 pandas numpy requests python-dotenv

      - name: Run Macro & Financial Stress Reports
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          echo "1. 글로벌 매크로 브리핑 실행"
          python macro_production.py MORNING
          
          echo "2. 금융 스트레스 & 포지션 정밀 진단 통합 리포트 실행"
          python financial_stress_report.py
